name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # packwiz publishes no tagged releases, so we pin a commit SHA.
      # Kept in sync with PACKWIZ_REF in the Makefile.
      - name: Install pinned packwiz
        run: make tools

      # Uses the same Makefile targets a human runs locally, so the two
      # cannot drift. `check` fails if the committed index is stale.
      - name: Verify index is up to date
        run: make check

      - name: Build .mrpack
        run: make build

      - name: Resolve artifact name
        id: pack
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: schematic-${{ steps.pack.outputs.version }}-mrpack
          path: build/*.mrpack
          if-no-files-found: error
