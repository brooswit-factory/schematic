name: Server update

# Uploads the packwiz pack to a game server over FTP, then announces and
# restarts it over RCON. Both halves skip independently (and the run still
# succeeds) when their secrets are not configured — see the "check secrets"
# step below.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce (defaults to the pack.toml version)'
        required: false
        type: string
  # TEMPORARY — added only to obtain a real dry-run URL on this branch,
  # since GitHub only allows dispatching workflow_dispatch via API/CLI for a
  # workflow file already on the default branch. Removed in the next commit;
  # the run URL stays valid after removal.
  pull_request:

permissions:
  contents: read

jobs:
  server-update:
    name: Update server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # github.event.release.tag_name and inputs.version are attacker-influenced
      # (a release tag or dispatch input), so they must never be interpolated
      # directly into the run: shell body — GitHub substitutes them textually
      # before the shell runs, which is a script-injection vector. Pass them
      # through env: instead.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            version="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml)"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Secrets cannot be read directly in an `if:` expression, so this step
      # reads them from env and writes booleans to $GITHUB_OUTPUT instead.
      # Never echo the secret values themselves.
      - name: Check secrets
        id: secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RCON_HOST: ${{ secrets.RCON_HOST }}
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "has_ftp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ftp=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RCON_HOST" ] && [ -n "$RCON_PASSWORD" ]; then
            echo "has_rcon=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rcon=false" >> "$GITHUB_OUTPUT"
          fi

      # Uploads only modpack content (pack.toml, index.toml, mods/, config/ if
      # present) — never .git, bin/, build/, or repo tooling/docs.
      - name: Upload pack over FTP
        if: steps.secrets.outputs.has_ftp == 'true'
        # Pinned to a specific release tag.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            bin/**
            build/**
            .github/**
            server/**
            README.md
            Makefile
            .packwizignore

      - name: Skip server upload
        if: steps.secrets.outputs.has_ftp != 'true'
        run: echo "FTP secrets not set — skipping server upload"

      # mcrcon, pinned to release v0.7.2 (https://github.com/Tiiffi/mcrcon).
      - name: Install mcrcon
        if: steps.secrets.outputs.has_rcon == 'true'
        run: |
          curl -fsSL -o mcrcon.tar.gz \
            https://github.com/Tiiffi/mcrcon/releases/download/v0.7.2/mcrcon-0.7.2-linux-x86-64.tar.gz
          tar -xzf mcrcon.tar.gz mcrcon
          rm mcrcon.tar.gz

      - name: Announce and restart over RCON
        if: steps.secrets.outputs.has_rcon == 'true'
        env:
          MCRCON_HOST: ${{ secrets.RCON_HOST }}
          MCRCON_PORT: ${{ vars.RCON_PORT || '25575' }}
          MCRCON_PASS: ${{ secrets.RCON_PASSWORD }}
          RESTART_COMMAND: ${{ vars.RCON_RESTART_COMMAND || 'stop' }}
          PACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./mcrcon -H "$MCRCON_HOST" -P "$MCRCON_PORT" \
            "say Modpack updated to $PACK_VERSION — restart to apply" \
            "$RESTART_COMMAND"

      - name: Skip RCON announce
        if: steps.secrets.outputs.has_rcon != 'true'
        run: echo "RCON secrets not set — skipping RCON announce"
