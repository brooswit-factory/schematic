name: Reusable CI

# Callable from a consumer's thin ci.yml stub. Validates the pack and builds
# the .mrpack. Runs against the CALLER's checkout — actions/checkout below
# checks out whichever repo invoked this workflow, not this one.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # packwiz publishes no tagged releases, so we pin a commit SHA.
      # Kept in sync with PACKWIZ_REF in the Makefile.
      - name: Install pinned packwiz
        run: make tools

      # Uses the same Makefile targets a human runs locally, so the two
      # cannot drift. `check` fails if the committed index is stale.
      - name: Verify index is up to date
        run: make check

      - name: Build .mrpack
        run: make build

      # No pack name is hardcoded here — every consumer repo has its own
      # pack.toml `name`, so we read both name and version out of it.
      - name: Resolve artifact name
        id: pack
        run: |
          echo "name=$(sed -n 's/^name = "\(.*\)"/\1/p' pack.toml)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}-${{ steps.pack.outputs.version }}-mrpack
          path: build/*.mrpack
          if-no-files-found: error
