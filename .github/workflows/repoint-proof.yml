name: "[Spike KAN-723] repoint.sh live proof"

# Temporary CI scaffolding for KAN-723 — NOT a deliverable itself (repoint.sh
# is the deliverable). Runs repoint.sh twice against the real Modrinth
# Server (server_id ff783f0f-ec3c-4037-b39f-452ce590891d, confirmed via the
# auth probe) to produce the before/after re-point transcript the ticket
# requires:
#   Step A: bootstrap — install Create+ (t1tOiUHZ) version Tg9n3zcA
#           (6.0.0-alpha-d) as the server's first-ever upstream.
#   Step B: the actual proof — re-point to a DIFFERENT version of the same
#           pack (3XKDXorU, 6.0.0-alpha-e) and apply it.
# repoint.sh itself performs every API call; this workflow only supplies the
# real MODRINTH_TOKEN (unavailable outside CI) and captures its output.
#
# Deleted (along with the .github/workflows/ copy of probe-auth.yml) in the
# final commit on this branch before the PR is opened — see KAN-723/KAN-715
# discussion on why a standing, secret-touching workflow should not ride
# into main from a spike.

on:
  push:
    branches: ['KAN-723']
    paths: ['.github/workflows/repoint-proof.yml']
  workflow_dispatch: {}
# re-run marker: repoint.sh fixed (empty-body tolerance)

permissions:
  contents: read

jobs:
  repoint-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Diagnostic: compare token identity vs server owner (GET-by-id 403'd; ids are not secrets)"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          curl -sS -o /tmp/me.json -H "Authorization: ${MODRINTH_TOKEN}" https://api.modrinth.com/v2/user
          curl -sS -o /tmp/list.json -H "Authorization: Bearer ${MODRINTH_TOKEN}" -H "X-Panel-Version: 1" https://archon.modrinth.com/modrinth/v0/servers
          python3 -c "
import json
me = json.load(open('/tmp/me.json'))
print('token user id:', me.get('id'), '| username:', me.get('username'))
lst = json.load(open('/tmp/list.json'))
for s in lst.get('servers', []):
    print('server_id:', s.get('server_id'), '| owner_id:', s.get('owner_id'), '| current_user_permissions:', s.get('current_user_permissions'))
print('users map keys:', list(lst.get('users', {}).keys()))
for k, v in lst.get('users', {}).items():
    print('  users[', k, ']:', {kk: vv for kk, vv in v.items() if kk in ('id','username')})
"

      - name: "Step A: bootstrap upstream (Create+ 6.0.0-alpha-d)"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          chmod +x spike/modrinth-servers/repoint.sh
          ./spike/modrinth-servers/repoint.sh \
            ff783f0f-ec3c-4037-b39f-452ce590891d \
            t1tOiUHZ \
            Tg9n3zcA

      - name: "Step B: re-point proof (Create+ 6.0.0-alpha-e — different version, same pack)"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          ./spike/modrinth-servers/repoint.sh \
            ff783f0f-ec3c-4037-b39f-452ce590891d \
            t1tOiUHZ \
            3XKDXorU
