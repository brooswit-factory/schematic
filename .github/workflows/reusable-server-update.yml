name: Reusable Server update

# Callable from a consumer's thin server-update.yml stub. After a release
# publishes a version to Modrinth, re-points a Modrinth-hosted server's
# upstream at that published version and restarts it. Skips cleanly (and the
# run still succeeds) when MODRINTH_SERVER_ID / MODRINTH_TOKEN are not
# configured — see the "Check configuration" step below. Runs against the
# CALLER's checkout — actions/checkout below checks out whichever repo
# invoked this workflow, not this one.
#
# `github.event_name` / `github.event.release.*` here reflect the CALLER's
# original triggering event, not a synthetic "workflow_call" event — see the
# note in reusable-release.yml for how that was verified.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to look up on Modrinth, forwarded from the stub's
          workflow_dispatch input. Ignored when the caller was triggered by a
          published release — this workflow reads github.event.release.tag_name
          directly for that case, falling back to pack.toml otherwise.
        required: false
        type: string

jobs:
  server-update:
    name: Update server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # github.event.release.tag_name and inputs.version are attacker-influenced
      # (a release tag or dispatch input), so they must never be interpolated
      # directly into the run: shell body — GitHub substitutes them textually
      # before the shell runs, which is a script-injection vector. Pass them
      # through env: instead.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml)"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Secrets cannot be read directly in an `if:` expression, so this step
      # reads them from env and writes a single boolean to $GITHUB_OUTPUT
      # instead. Never echo the values themselves. A missing
      # MODRINTH_PROJECT_ID alongside the other two IS configured is a
      # misconfiguration (it would otherwise fall through to an opaque
      # /v2/project//version 404 below), so it fails loudly rather than
      # skipping.
      - name: Check configuration
        id: config
        env:
          MODRINTH_SERVER_ID: ${{ vars.MODRINTH_SERVER_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -n "$MODRINTH_SERVER_ID" ] && [ -n "$MODRINTH_TOKEN" ]; then
            if [ -z "$MODRINTH_PROJECT_ID" ]; then
              echo "::error::MODRINTH_SERVER_ID and MODRINTH_TOKEN are set but MODRINTH_PROJECT_ID is not — set the MODRINTH_PROJECT_ID repo variable to the Modrinth project this server should follow."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Modrinth server update
        if: steps.config.outputs.configured != 'true'
        run: echo "MODRINTH_SERVER_ID / MODRINTH_TOKEN not set — skipping Modrinth server update"

      # Looks up the just-published version on Modrinth by its version
      # number. The read is authenticated (MODRINTH_TOKEN as an Authorization
      # header) because a Modrinth project stays a DRAFT — invisible to
      # unauthenticated reads — until Modrinth moderation approves it, which
      # every consumer's first releases go through unauthenticated.
      # On the release path, release.yml and server-update.yml both fire on
      # the same `release: published` event with no ordering dependency, so
      # reusable-release.yml may still be building/publishing the .mrpack
      # when this step starts; this polls, bounded, for up to ~5 minutes
      # (20 attempts x 15s) before failing. On workflow_dispatch the version
      # is expected to already exist (a manual re-point), so it tries once
      # and fails fast. Exhausting the budget without a match is a real
      # error worth failing loudly for, not a skip.
      - name: Resolve published version id
        if: steps.config.outputs.configured == 'true'
        id: modrinth_version
        env:
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # curl -f collapses any HTTP error into a generic exit, which would
          # make a 404 (project not visible) indistinguishable from a 200
          # with no matching version (version not published yet). Capture
          # the status code explicitly instead so the two causes can be
          # reported separately below.
          if [ "$EVENT_NAME" = "release" ]; then
            max_attempts=20
            interval=15
          else
            max_attempts=1
            interval=15
          fi
          total_budget=$((max_attempts * interval))

          version_id=""
          http_code=""
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            http_code="$(curl -sSL -o /tmp/modrinth_versions.json -w '%{http_code}' \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: brooswit-minecraft/schematic (server-update workflow)" \
              "https://api.modrinth.com/v2/project/${PROJECT_ID}/version")"

            if [ "$http_code" = "200" ]; then
              version_id="$(jq -r --arg v "$VERSION" '[.[] | select(.version_number == $v)][0].id // empty' /tmp/modrinth_versions.json)"
              if [ -n "$version_id" ]; then
                echo "Attempt ${attempt}/${max_attempts}: found Modrinth version ${VERSION} for project ${PROJECT_ID}."
                break
              fi
            elif [ "$http_code" != "404" ]; then
              echo "::error::Modrinth API request for project ${PROJECT_ID} failed with HTTP ${http_code} (attempt ${attempt}/${max_attempts})."
              exit 1
            fi

            elapsed=$(((attempt - 1) * interval))
            remaining=$((total_budget - elapsed))
            echo "Attempt ${attempt}/${max_attempts}: no matching Modrinth version yet for project ${PROJECT_ID} version ${VERSION} (elapsed ${elapsed}s, ~${remaining}s of the ~${total_budget}s budget remaining)."

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$interval"
            fi
            attempt=$((attempt + 1))
          done

          if [ -z "$version_id" ]; then
            if [ "$http_code" = "404" ]; then
              echo "::error::Modrinth project ${PROJECT_ID} is not visible (HTTP 404) — it may still be a draft awaiting Modrinth moderation approval, the project id may be wrong, or MODRINTH_TOKEN may lack access to it."
            else
              echo "::error::No Modrinth version found for project ${PROJECT_ID} with version_number ${VERSION} after ${max_attempts} attempt(s) over ~${total_budget}s — has this release been published to Modrinth yet?"
            fi
            exit 1
          fi
          echo "id=$version_id" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.config.outputs.configured == 'true'

      # Re-points the server's upstream at the resolved version id above and
      # restarts it, via the rinth CLI. Pinned to a commit sha (rinth has no
      # tags yet) rather than a branch ref, since a branch ref is a moving
      # target an upstream maintainer could repoint underneath this workflow.
      - name: Update Modrinth server
        if: steps.config.outputs.configured == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SERVER_ID: ${{ vars.MODRINTH_SERVER_ID }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION_ID: ${{ steps.modrinth_version.outputs.id }}
        run: bunx --bun github:brooswit-minecraft/rinth#206e4e4d9913c5c0013cf3109c237cd4bb84954e servers upstream "$SERVER_ID" --project "$PROJECT_ID" --version "$VERSION_ID" --restart --json
